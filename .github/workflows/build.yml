  name: Android CI & Build APK

  on:
    push:
      branches:
        - "master"
        - "main"
      tags:
        - "v*"

    pull_request:
      branches:
        - "master"
        - "main"

    workflow_dispatch:

  # GitHub Actions 权限
  permissions:
    contents: write

  jobs:
    build:
      name: Build & Package APK
      runs-on: ubuntu-latest

      steps:

        # ============================================================
        # 1. Checkout
        # ============================================================
        - name: Checkout Code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0


        # ============================================================
        # 2. 设置 JDK 17
        # ============================================================
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: "17"
            distribution: "temurin"
            cache: gradle


        # ============================================================
        # 3. 设置 Gradle
        # ============================================================
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4


        # ============================================================
        # 4. Gradle Wrapper 执行权限
        # ============================================================
        - name: Grant execute permission for gradlew
          run: chmod +x ./gradlew


        # ============================================================
        # 5. 配置与验证 Android 签名文件
        # ============================================================
        - name: Setup Keystore
          env:
            KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
            KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          run: |
            set -e
            mkdir -p app
            if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              echo "Using configured GitHub Secrets for signing."
              echo "$KEYSTORE_BASE64" | base64 --decode > app/app.jks
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
              echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
              echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            else
              echo "GitHub Secrets for signing not set. Generating fallback self-signed keystore..."
              keytool -genkeypair -v \
                -keystore app/app.jks \
                -alias "battery" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "android" \
                -keypass "android" \
                -dname "CN=Battery, OU=App, O=Battery, L=Unknown, S=Unknown, C=US"
              echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
              echo "KEY_ALIAS=battery" >> $GITHUB_ENV
              echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            fi

        # ============================================================
        # 6. 验证 Keystore
        #
        # 不输出密码
        # 只验证 JKS 是否有效以及 Alias 是否存在
        # ============================================================
        - name: Verify Keystore
          run: |
            set -e
            keytool -list \
              -keystore app/app.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              > /dev/null
            echo "Keystore and alias verified successfully."

        # ============================================================
        # 7. Build Release + Debug APK
        #
        # 只执行一次，删除原来重复的 Build APK 步骤
        # ============================================================
        - name: Build APK
          run: |
            ./gradlew assembleRelease assembleDebug --stacktrace
        

        # ============================================================
        # 9. 显示生成的 APK
        # ============================================================
        - name: List APK Files
          run: |
            echo "Generated APK files:"
            find app/build/outputs/apk -type f -name "*.apk" -print
        

        # ============================================================
        # 10. 上传 Debug APK
        # ============================================================
        - name: Upload Debug APK
          uses: actions/upload-artifact@v4
          with:
            name: Weather-Debug-APK
            path: app/build/outputs/apk/debug/*.apk
            if-no-files-found: error


        # ============================================================
        # 11. 上传 Release APK
        # ============================================================
        - name: Upload Release APK
          uses: actions/upload-artifact@v4
          with:
            name: Weather-Release-APK
            path: app/build/outputs/apk/release/*.apk
            if-no-files-found: error


        # ============================================================
        # 12. 提取提交 Summary 并生成 Release 更新记录
        # ============================================================
        - name: Generate Release Notes
          if: startsWith(github.ref, 'refs/tags/v')
          run: |
            CURRENT_TAG="${{ github.ref_name }}"
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

            echo "## 📦 应用安装包" > release_notes.md
            echo "- 🚀 **Release APK**: 经由正式签名，推荐日常使用" >> release_notes.md
            echo "- 🛠️ **Debug APK**: 调试开发包" >> release_notes.md
            echo "" >> release_notes.md

            TAG_MESSAGE=$(git tag -l --format='%(contents)' "$CURRENT_TAG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$TAG_MESSAGE" ]; then
              echo "## 📌 版本说明" >> release_notes.md
              echo "$TAG_MESSAGE" >> release_notes.md
              echo "" >> release_notes.md
            fi

            echo "## 📝 提交更新记录 (Changelog)" >> release_notes.md
            if [ -n "$PREV_TAG" ]; then
              echo "> 统计范围：\`$PREV_TAG\` $\rightarrow$ \`$CURRENT_TAG\`" >> release_notes.md
              echo "" >> release_notes.md
              git log "${PREV_TAG}..${CURRENT_TAG}" --no-merges --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
            else
              echo "> 初始发布版本：\`$CURRENT_TAG\`" >> release_notes.md
              echo "" >> release_notes.md
              git log -1 --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
            fi

            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "---" >> release_notes.md
            echo "*构建编号: #${{ github.run_number }} | 触发提交: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})*" >> release_notes.md


        # ============================================================
        # 13. Tag v* 时自动创建 GitHub Release
        #
        # 例如：
        # v1.0.0
        # v1.1.0
        # v2.0.0
        # ============================================================
        - name: Create GitHub Release
          if: startsWith(github.ref, 'refs/tags/v')
          uses: softprops/action-gh-release@v2
          with:
            name: Battery ${{ github.ref_name }}
            files: |
              app/build/outputs/apk/release/*.apk
              app/build/outputs/apk/debug/*.apk
            body_path: release_notes.md
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


        # ============================================================
        # 14. 清理签名与临时文件
        #
        # 避免后续步骤意外使用
        # ============================================================
        - name: Cleanup Keystore and Temporary Files
          if: always()
          run: |
            rm -f app/app.jks release_notes.md
    
